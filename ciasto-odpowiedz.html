<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Filemon — Odpowiedź na zapytanie</title>
<style>
  :root {
    --navy:   #2C3E6A;
    --green:  #1DB96A;
    --red:    #E84040;
    --bg:     #F0EDF8;
    --card:   #FFFFFF;
    --text:   #1B2A4A;
    --muted:  #7A8AAA;
    --border: rgba(27,42,74,0.12);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 2rem;
  }
  header {
    background: var(--navy);
    padding: 1.2rem 1.5rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }
  .header-text h1 { color:#fff; font-size:1.05rem; font-weight:700; }
  .header-text p  { color:rgba(255,255,255,0.5); font-size:0.72rem; margin-top:0.1rem; text-transform:uppercase; letter-spacing:0.08em; }

  .section { margin: 1.2rem 1rem 0; }
  .section-label {
    font-size: 0.7rem; font-weight:700; text-transform:uppercase;
    letter-spacing:0.12em; color:var(--muted); margin-bottom:0.6rem;
  }
  .card {
    background: var(--card); border-radius:16px;
    padding: 1rem 1.1rem;
    box-shadow: 0 2px 12px rgba(27,42,74,0.08);
  }
  .info-row {
    display:flex; justify-content:space-between; align-items:center;
    padding: 0.45rem 0; border-bottom: 1px solid var(--border); font-size:0.9rem;
    gap: 1rem;
  }
  .info-row:last-child { border-bottom:none; }
  .info-label { color:var(--muted); font-size:0.78rem; white-space:nowrap; }
  .info-value { font-weight:600; text-align:right; }

  .sms-bubble {
    background: #e5e5ea;
    border-radius: 16px 16px 4px 16px;
    padding: 0.9rem 1rem;
    font-size: 0.93rem;
    line-height: 1.6;
    color: #1c1c1e;
    white-space: pre-wrap;
    word-break: break-word;
    user-select: all;
    -webkit-user-select: all;
  }
  .sms-bubble.confirm { background: #d1f2e0; }
  .sms-bubble.deny    { background: #fde8e8; }

  .sms-btn {
    display: flex; align-items:center; justify-content:center; gap:0.5rem;
    width: 100%; margin-top: 0.65rem;
    padding: 0.85rem; border:none; border-radius:12px;
    font-size: 0.95rem; font-weight:700; cursor:pointer;
    transition: opacity 0.15s, transform 0.1s;
    font-family: inherit; text-decoration:none; color:#fff;
  }
  .sms-btn:active { transform:scale(0.97); opacity:0.85; }
  .sms-btn.confirm { background: var(--green); }
  .sms-btn.deny    { background: var(--red); }
  .sms-btn:disabled { opacity: 0.5; cursor:default; }

  .btn-row { display:flex; gap:0.6rem; margin-top:0.65rem; }
  .btn-row .sms-btn { margin-top:0; width:auto; flex:1 1 auto; }
  .sms-btn.edit-btn { background: var(--navy); flex:0 0 auto; width:auto; padding:0.85rem 1rem; }
  .sms-btn.cancel-btn { background: var(--muted); }
  .sms-btn.save-btn { background: var(--navy); }

  .sms-edit {
    width:100%; font-family:inherit; font-size:0.93rem; line-height:1.6;
    color:#1c1c1e; border-radius:16px; border:1px solid var(--border);
    padding:0.9rem 1rem; resize:vertical; min-height:160px;
    background:#fff;
  }
  .edit-actions { display:flex; gap:0.6rem; margin-top:0.65rem; }
  .edit-actions .sms-btn { margin-top:0; }

  .field-row { display:flex; flex-direction:column; gap:0.3rem; margin-bottom:0.8rem; }
  .field-row label { font-size:0.72rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; }
  .field-row input {
    font-family:inherit; font-size:0.92rem; padding:0.65rem 0.8rem;
    border:1px solid var(--border); border-radius:10px; background:#fff; color:var(--text);
  }
  .manual-toggle {
    font-size:0.75rem; color:var(--navy); text-decoration:underline; cursor:pointer;
    text-align:center; margin-top:0.6rem; display:block;
  }

  .tip { font-size:0.7rem; color:var(--muted); text-align:center; margin-top:0.4rem; }
  .error { text-align:center; padding:3rem 1rem; color:var(--muted); }

  .popup-overlay {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,0.45); z-index:200;
    align-items:center; justify-content:center;
  }
  .popup-overlay.show { display:flex; }
  .popup-box {
    background:#fff; border-radius:20px;
    padding:2rem 1.5rem; margin:1.5rem;
    text-align:center; max-width:320px; width:100%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .popup-icon { font-size:3rem; margin-bottom:0.5rem; }
  .popup-title { font-size:1.15rem; font-weight:700; margin-bottom:0.4rem; }
  .popup-desc { font-size:0.88rem; color:var(--muted); margin-bottom:1.2rem; line-height:1.5; white-space:pre-wrap; }
  .popup-close {
    background:var(--navy); color:#fff; border:none;
    padding:0.75rem 2rem; border-radius:12px;
    font-size:0.95rem; font-weight:700; cursor:pointer;
    font-family:inherit; width:100%;
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="header-text">
      <h1>Filemon</h1>
      <p>Odpowiedź na zapytanie o ciasto</p>
    </div>
  </div>
</header>

<div id="app"></div>

<div class="popup-overlay" id="popup">
  <div class="popup-box">
    <div class="popup-icon" id="popup-icon">✅</div>
    <div class="popup-title" id="popup-title">SMS wysłany!</div>
    <div class="popup-desc" id="popup-desc"></div>
    <button class="popup-close" onclick="document.getElementById('popup').classList.remove('show')">OK</button>
  </div>
</div>

<script>
// Usuwa polskie znaki (ą→a, ę→e, itd.) — SMS musi być bez ogonków
function bezOgonkow(str) {
  return (str||'')
    .replace(/ą/g,'a').replace(/Ą/g,'A')
    .replace(/ć/g,'c').replace(/Ć/g,'C')
    .replace(/ę/g,'e').replace(/Ę/g,'E')
    .replace(/ł/g,'l').replace(/Ł/g,'L')
    .replace(/ń/g,'n').replace(/Ń/g,'N')
    .replace(/ó/g,'o').replace(/Ó/g,'O')
    .replace(/ś/g,'s').replace(/Ś/g,'S')
    .replace(/ź/g,'z').replace(/Ź/g,'Z')
    .replace(/ż/g,'z').replace(/Ż/g,'Z');
}

// ─── DANE DO PRZELEWU — uzupełnij prawdziwe dane firmy przed użyciem ───
const KONTO_NUMER   = 'PL00 0000 0000 0000 0000 0000 0000';
const KONTO_ODBIORCA = 'Filemon Kocia Kawiarnia';

function phoneDigits(val){
  let d=(val||'').replace(/\D/g,'');
  if(d.startsWith('0048'))d=d.slice(4);
  else if(d.startsWith('48')&&d.length>9)d=d.slice(2);
  return d.slice(0,9);
}
function phoneToSmsFormat(val){
  const d = phoneDigits(val);
  return '48'+d;
}
function formatPhoneDisplay(val){
  const d=phoneDigits(val);
  const parts=[];
  if(d.length>0)parts.push(d.slice(0,3));
  if(d.length>3)parts.push(d.slice(3,6));
  if(d.length>6)parts.push(d.slice(6,9));
  return parts.join('-');
}

const p = new URLSearchParams(location.search);
const tel      = p.get('tel')      || '';
const imiePelne= p.get('imie')     || '';
const imie     = bezOgonkow(imiePelne.split(' ')[0] || '');
const ciasta   = p.get('ciasta')   || '';
const data     = p.get('data')     || '';      // np. "28 lipca (wtorek)"
const godz     = p.get('godz')     || '';
const wartosc  = p.get('wartosc')  || '';       // np. "320"
const zadatek  = p.get('zadatek')  || '';        // np. "96"
const pozostalo= p.get('pozostalo')|| '';        // np. "224"
const uwagi    = p.get('uwagi')    || '';

const SMSAPI_SENDER = 'Filemon';

function skrocData(d){
  const miesiaceMapa = {
    'stycznia':1,'lutego':2,'marca':3,'kwietnia':4,'maja':5,'czerwca':6,
    'lipca':7,'sierpnia':8,'września':9,'października':10,'listopada':11,'grudnia':12
  };
  const dniMapa = {
    'poniedziałek':'pon','wtorek':'wt','środa':'sro','czwartek':'czw',
    'piątek':'pt','sobota':'sob','niedziela':'nd'
  };
  const m = d.match(/(\d+)\s+(\S+)\s*\((\S+)\)/);
  if (m) {
    const dzien = m[1].padStart(2,'0');
    const mies  = String(miesiaceMapa[m[2].toLowerCase()] || m[2]).padStart(2,'0');
    const dz    = dniMapa[m[3].toLowerCase()] || m[3];
    return `${dzien}-${mies} (${dz})`;
  }
  return d;
}
const dataKrotka = data ? skrocData(data) : '';

// ─── SZABLONY WIADOMOŚCI (bez polskich znaków — wymóg SMS) ───
function buildConfirmText(){
  const ciastaB = bezOgonkow(ciasta);
  const dataB   = bezOgonkow(dataKrotka || data);
  let txt = `Czesc ${imie}!\n\nMamy wolny termin! Potwierdzamy zamowienie:\n${ciastaB}\n\nOdbior: ${dataB} o ${godz}\n\nWartosc zamowienia: ${wartosc} zl\nZadatek (30%) do wplaty w ciagu 48h:\n${zadatek} zl na konto:\n${bezOgonkow(KONTO_NUMER)}\nOdbiorca: ${bezOgonkow(KONTO_ODBIORCA)}\nTytul: Zadatek ${imie} ${dataB}\n\nPozostalo do zaplaty przy odbiorze: ${pozostalo} zl\n\nDo zobaczenia!\nFilemon Kocia Kawiarnia`;
  return bezOgonkow(txt);
}
function buildDenyText(){
  const dataB = bezOgonkow(dataKrotka || data);
  let txt = `Czesc ${imie}!\n\nDziekujemy za zapytanie o ciasto. Niestety na ${dataB} o ${godz} nie mamy juz wolnego terminu na realizacje tego zamowienia.\n\nZadzwon lub napisz do nas, chetnie zaproponujemy inny dostepny termin.\n\nFilemon Kocia Kawiarnia`;
  return bezOgonkow(txt);
}

let txtConfirm = tel ? buildConfirmText() : '';
let txtDeny    = tel ? buildDenyText()    : '';

// ─── EDYCJA TREŚCI SMS ───
window.edytujSMS = function(typ) {
  document.getElementById('bubble-' + typ).style.display = 'none';
  document.getElementById('btn-row-' + typ).style.display = 'none';
  document.getElementById('edit-' + typ).style.display = 'block';
  document.getElementById('edit-actions-' + typ).style.display = 'flex';
};
window.anulujEdycje = function(typ) {
  const tresc = typ === 'confirm' ? txtConfirm : txtDeny;
  document.getElementById('edit-' + typ).value = tresc;
  document.getElementById('edit-' + typ).style.display = 'none';
  document.getElementById('edit-actions-' + typ).style.display = 'none';
  document.getElementById('bubble-' + typ).style.display = 'block';
  document.getElementById('btn-row-' + typ).style.display = 'flex';
};
window.zapiszEdycje = function(typ) {
  const nowaTresc = document.getElementById('edit-' + typ).value;
  if (typ === 'confirm') txtConfirm = nowaTresc; else txtDeny = nowaTresc;
  document.getElementById('bubble-' + typ).textContent = nowaTresc;
  document.getElementById('edit-' + typ).style.display = 'none';
  document.getElementById('edit-actions-' + typ).style.display = 'none';
  document.getElementById('bubble-' + typ).style.display = 'block';
  document.getElementById('btn-row-' + typ).style.display = 'flex';
};

window.wyslijSMS = async function(typ) {
  const tresc = typ === 'confirm' ? txtConfirm : txtDeny;
  const btn = document.getElementById('btn-' + typ);
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Wysyłanie...';

  try {
    const res = await fetch('https://serwer2679123.hosting-home.pl/sms-proxy.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        to:      phoneToSmsFormat(tel),
        message: tresc,
        from:    SMSAPI_SENDER,
        format:  'json',
      })
    });

    const resp = await res.json();

    if (resp.count && resp.count > 0) {
      btn.textContent = '✓ Wysłano!';
      btn.style.background = '#1DB96A';
      const other = typ === 'confirm' ? 'deny' : 'confirm';
      const otherBtn = document.getElementById('btn-' + other);
      if (otherBtn) { otherBtn.disabled = true; otherBtn.style.opacity = '0.4'; }
      ['confirm','deny'].forEach(t => {
        const editBtn = document.querySelector('#btn-row-' + t + ' .edit-btn');
        if (editBtn) editBtn.disabled = true;
      });

      const isConfirm = typ === 'confirm';
      document.getElementById('popup-icon').textContent  = isConfirm ? '✅' : '❌';
      document.getElementById('popup-title').textContent = 'SMS wysłany!';
      document.getElementById('popup-desc').textContent  = isConfirm
        ? 'Potwierdzenie terminu i informacja o zadatku zostały wysłane do ' + imie + '.'
        : 'Informacja o braku wolnego terminu została wysłana do ' + imie + '.';
      document.getElementById('popup').classList.add('show');
    } else {
      throw new Error(JSON.stringify(resp));
    }
  } catch(e) {
    btn.disabled = false;
    btn.textContent = originalText;
    document.getElementById('popup-icon').textContent  = '⚠️';
    document.getElementById('popup-title').textContent = 'Błąd wysyłki';
    document.getElementById('popup-desc').textContent  = 'Nie udało się wysłać SMS. Spróbuj ponownie.\n\n' + e.message;
    document.getElementById('popup').classList.add('show');
  }
}

const app = document.getElementById('app');

if (!tel || !imie) {
  app.innerHTML = `
    <div class="section">
      <div class="card error">
        </div>
    </div>`;
} else {
  app.innerHTML = `
    <div class="section">
      <div class="section-label">Dane zapytania</div>
      <div class="card">
        <div class="info-row"><span class="info-label">Klient</span><span class="info-value">${imiePelne}</span></div>
        <div class="info-row"><span class="info-label">Telefon</span><span class="info-value">${formatPhoneDisplay(tel)}</span></div>
        <div class="info-row"><span class="info-label">Ciasta</span><span class="info-value">${ciasta}</span></div>
        <div class="info-row"><span class="info-label">Odbiór</span><span class="info-value">${data} ${godz ? 'o '+godz : ''}</span></div>
        <div class="info-row"><span class="info-label">Wartość</span><span class="info-value">${wartosc} zł</span></div>
        <div class="info-row"><span class="info-label">Zadatek (30%)</span><span class="info-value">${zadatek} zł</span></div>
        <div class="info-row"><span class="info-label">Pozostało</span><span class="info-value">${pozostalo} zł</span></div>
        ${uwagi ? `<div class="info-row"><span class="info-label">Uwagi</span><span class="info-value">${uwagi}</span></div>` : ''}
      </div>
    </div>

    <div class="section">
      <div class="section-label">✅ Wolny termin — potwierdzenie + zadatek</div>
      <div class="card">
        <div class="sms-bubble confirm" id="bubble-confirm">${txtConfirm}</div>
        <textarea class="sms-edit" id="edit-confirm" style="display:none;">${txtConfirm}</textarea>
        <div class="edit-actions" id="edit-actions-confirm" style="display:none;">
          <button class="sms-btn cancel-btn" onclick="anulujEdycje('confirm')">Anuluj</button>
          <button class="sms-btn save-btn" onclick="zapiszEdycje('confirm')">Zapisz</button>
        </div>
        <div class="btn-row" id="btn-row-confirm">
          <button id="btn-confirm" class="sms-btn confirm" onclick="wyslijSMS('confirm')">✅ Wyślij — Potwierdzenie</button>
          <button class="sms-btn edit-btn" onclick="edytujSMS('confirm')"> ✏️ </button>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-label">❌ Brak wolnego terminu</div>
      <div class="card">
        <div class="sms-bubble deny" id="bubble-deny">${txtDeny}</div>
        <textarea class="sms-edit" id="edit-deny" style="display:none;">${txtDeny}</textarea>
        <div class="edit-actions" id="edit-actions-deny" style="display:none;">
          <button class="sms-btn cancel-btn" onclick="anulujEdycje('deny')">Anuluj</button>
          <button class="sms-btn save-btn" onclick="zapiszEdycje('deny')">Zapisz</button>
        </div>
        <div class="btn-row" id="btn-row-deny">
          <button id="btn-deny" class="sms-btn deny" onclick="wyslijSMS('deny')">❌ Wyślij — Brak terminu</button>
          <button class="sms-btn edit-btn" onclick="edytujSMS('deny')"> ✏️ </button>
        </div>
      </div>
    </div>

    <p class="tip">Obie wiadomości można edytować przed wysłaniem (ikona ✏️).</p>
  `;
}
</script>
</body>
</html>
