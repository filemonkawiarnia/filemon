<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sklep u Ali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF8EC;
    --ink:#3B2A2F;
    --ink-soft:#7A6A6E;
    --paper:#FFFFFF;
    --paper-edge:#E9E1D6;
    --gold:#D9A400;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--cream);
    font-family:'Nunito',sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    min-height:100vh;
    overflow-x:hidden;
  }

  header{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 20px;
    background:var(--paper);
    border-bottom:3px dashed var(--paper-edge);
  }
  header img{width:52px;height:52px;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.12);}
  header h1{
    font-family:'Fredoka',sans-serif;
    font-size:22px;
    margin:0;
    flex:1;
    letter-spacing:.3px;
  }
  #status{
    font-size:13px;
    font-weight:700;
    padding:6px 12px;
    border-radius:999px;
    background:#F1EAE0;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  #status.ok{background:#DEF3DE;color:#2E6B34;}
  #status.err{background:#FBE1E1;color:#A22E2E;}

  #btnSettings, #btnSzukaj{
    border:none;
    background:#F1EAE0;
    color:var(--ink-soft);
    width:38px;height:38px;
    border-radius:50%;
    font-size:18px;
    cursor:pointer;
    flex-shrink:0;
  }
  #btnSettings:active, #btnSzukaj:active{transform:scale(.92);}

  /* --- Modal ustawień klawiatury --- */
  #settingsOverlay{
    position:fixed; inset:0;
    background:rgba(59,42,47,.55);
    display:none;
    align-items:center; justify-content:center;
    z-index:50;
    padding:20px;
  }
  #settingsOverlay.show{display:flex;}
  #settingsPanel{
    background:var(--paper);
    border-radius:20px;
    width:100%;
    max-width:620px;
    max-height:88vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.25);
  }
  #settingsPanel header{
    background:var(--cream);
    border-bottom:3px dashed var(--paper-edge);
  }
  #settingsPanel header h2{
    font-family:'Fredoka',sans-serif;
    font-size:18px; margin:0; flex:1;
  }
  #settingsClose{
    border:none;background:transparent;font-size:22px;
    cursor:pointer;color:var(--ink-soft);
  }
  #settingsBody{
    padding:14px 18px;
    overflow-y:auto;
    flex:1;
  }
  .keyrow{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 0;
    border-bottom:1px dotted var(--paper-edge);
  }
  .keyrow .keylabel{
    width:150px;
    font-weight:700;
    font-size:14px;
    flex-shrink:0;
  }
  .keyrow select{
    flex:1;
    padding:8px 10px;
    border-radius:10px;
    border:1px solid var(--paper-edge);
    font-family:'Nunito',sans-serif;
    font-size:14px;
    background:#fff;
  }
  .keyrow .listenBtn{
    border:none;
    background:#F1EAE0;
    color:var(--ink-soft);
    font-size:12px;
    font-weight:700;
    padding:8px 10px;
    border-radius:10px;
    cursor:pointer;
    white-space:nowrap;
    min-width:96px;
  }
  .keyrow .listenBtn.listening{
    background:var(--gold);
    color:#fff;
    animation:pulse .6s ease infinite;
  }
  .keyrow .capturedCode{
    font-size:11px;
    color:var(--ink-soft);
    width:70px;
    text-align:center;
    flex-shrink:0;
  }
  #settingsFooter{
    display:flex; gap:10px;
    padding:12px 18px;
    border-top:3px dashed var(--paper-edge);
  }
  #settingsFooter button{
    flex:1;
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    border:none;
    border-radius:12px;
    padding:12px;
    cursor:pointer;
    font-size:14px;
  }
  #btnZapisz{background:var(--gold);color:#fff;}
  #btnReset{background:#F1EAE0;color:var(--ink-soft);}

  /* --- Wirtualny paragon na ekranie (fallback gdy brak drukarki) --- */
  #onscreenReceipt{
    position:fixed; inset:0;
    background:rgba(59,42,47,.65);
    display:none;
    align-items:center; justify-content:center;
    z-index:80;
    padding:24px;
    cursor:pointer;
  }
  #onscreenReceipt.show{display:flex;}
  #onscreenReceiptCard{
    background:#fff;
    border-radius:12px;
    padding:22px 26px;
    max-width:340px;
    width:100%;
    max-height:85vh;
    overflow-y:auto;
    box-shadow:0 12px 40px rgba(0,0,0,.3);
    font-family:'Nunito',monospace;
    cursor:default;
    animation:paragonWjazd .35s ease;
  }
  @keyframes paragonWjazd{
    from{transform:translateY(24px);opacity:0;}
    to{transform:translateY(0);opacity:1;}
  }
  #orLogo{display:block;width:70px;height:70px;margin:0 auto 10px;border-radius:50%;}
  .orLinia{
    display:flex; justify-content:space-between; gap:10px;
    font-size:14px; padding:4px 0;
    border-bottom:1px dotted var(--paper-edge);
  }
  .orNaglowek{
    justify-content:center;
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:16px;
    border-bottom:none;
    margin-bottom:6px;
  }
  .orKreska{border-top:2px dashed var(--paper-edge); margin:8px 0;}
  .orSuma{
    font-family:'Fredoka',sans-serif;
    font-size:19px;
    text-align:center;
    margin:4px 0 10px;
    color:var(--gold);
  }
  .orStopka{
    text-align:center;
    font-size:13px;
    color:var(--ink-soft);
    font-style:italic;
  }
  .orPodpowiedz{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:14px;
    opacity:.7;
  }

  #settingsCheckboxRow{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--cream);
    border-radius:12px;
    padding:10px 12px;
    margin-bottom:12px;
  }
  #settingsCheckboxRow label{
    font-size:13px;
    font-weight:700;
    flex:1;
  }
  #settingsCheckboxRow input{width:20px;height:20px;}

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:12px;
    min-height:0;
  }

  #grid{
    flex:1;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:10px;
    min-height:0;
  }

  .tile{
    border:none;
    border-radius:18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
    box-shadow:0 3px 0 rgba(0,0,0,.08);
  }
  .tile:active{transform:translateY(3px) scale(.98);box-shadow:none;}
  .tile img{width:clamp(40px,14vw,72px);height:clamp(40px,14vw,72px);object-fit:contain;}
  .tile .nazwa{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(12px,3vw,16px);}
  .tile .cena{font-size:clamp(11px,2.6vw,14px);font-weight:700;opacity:.75;}

  /* Panel paragonu - pasek na gorze ekranu, stylizowany jak papier z drukarki */
  #receipt-wrap{
    flex-shrink:0;
  }
  #receipt{
    background:var(--paper);
    border-radius:16px;
    padding:12px 14px 10px;
    box-shadow:0 4px 16px rgba(0,0,0,.08);
    position:relative;
    display:flex;
    flex-direction:column;
    max-height:32vh;
  }
  #receiptTop{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  #receipt h2{
    font-family:'Fredoka',sans-serif;
    font-size:14px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0;
  }
  #suma{
    font-family:'Fredoka',sans-serif;
    font-size:22px;
    color:var(--gold);
  }
  #suma.pulse{animation:pulse .4s ease;}
  #lista{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    overflow-y:auto;
    padding:8px 0;
    min-height:0;
  }
  #lista .pozycja{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--cream);
    border-radius:10px;
    padding:5px 10px;
    font-size:13px;
    white-space:nowrap;
  }
  #lista .pusto{
    text-align:center;
    width:100%;
    color:var(--ink-soft);
    font-style:italic;
    padding:6px 0;
    font-size:13px;
  }
  #cut-line{
    border-top:2px dashed var(--paper-edge);
    margin:2px 0 8px;
  }
  #receiptButtons{
    display:flex;
    gap:8px;
  }
  @keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.08);}100%{transform:scale(1);}}

  button.action{
    font-family:'Fredoka',sans-serif;
    font-size:15px;
    font-weight:600;
    border:none;
    border-radius:12px;
    padding:12px;
    cursor:pointer;
  }
  #btnDrukuj{
    flex:2;
    background:var(--gold);
    color:#fff;
    box-shadow:0 3px 0 #B58500;
  }
  #btnDrukuj:active{transform:translateY(3px);box-shadow:none;}
  #btnWyczysc{
    flex:1;
    background:#F1EAE0;
    color:var(--ink-soft);
    font-size:13px;
  }

  #scissors{
    position:fixed;
    font-size:26px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
  }
  #scissors.show{
    opacity:1;
    animation:snip .6s ease;
  }
  @keyframes snip{
    0%{transform:rotate(0deg);}
    30%{transform:rotate(-25deg);}
    60%{transform:rotate(10deg);}
    100%{transform:rotate(0deg);}
  }

  #toast{
    position:fixed;
    bottom:22px;left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:#fff;
    padding:12px 20px;
    border-radius:12px;
    font-weight:700;
    font-size:14px;
    opacity:0;
    transition:opacity .25s ease, transform .25s ease;
    pointer-events:none;
    max-width:80vw;
    text-align:center;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>

let audioCtx = null;
function pobierzAudioCtx(){
  if (!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function dzwiekiWlaczone(){
  return odczytajDane('dzwiekiWlaczone', true);
}

function zagrajTon(czestotliwosci, czasNuty=0.1, typ='sine', glosnosc=0.14){
  if (!dzwiekiWlaczone()) return;
  const ctx = pobierzAudioCtx();
  if (!ctx) return;
  const teraz = ctx.currentTime;
  czestotliwosci.forEach((freq, i) => {
    const start = teraz + i * czasNuty;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = typ;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(glosnosc, start + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.001, start + czasNuty);
    osc.connect(gain).connect(ctx.destination);
    osc.start(start);
    osc.stop(start + czasNuty + 0.02);
  });
}

const SEKWENCJA_ODBLOKOWANIA = [8, 8, 7, 1];
const CZAS_ODBLOKOWANIA_MS = 15000; // ile ms po wpisaniu kodu dziala ⚙️ i 🔍

let trybAdmina = false;
let trybAdminaTimer = null;
let ostatnieKlikniecia = [];

function sprawdzSekwencjeOdblokowania(indeksProduktu){
  ostatnieKlikniecia.push(indeksProduktu);
  if (ostatnieKlikniecia.length > SEKWENCJA_ODBLOKOWANIA.length){
    ostatnieKlikniecia.shift();
  }
  const pasuje = ostatnieKlikniecia.length === SEKWENCJA_ODBLOKOWANIA.length &&
    ostatnieKlikniecia.every((v, i) => v === SEKWENCJA_ODBLOKOWANIA[i]);
  if (pasuje){
    odblokujTrybAdmina();
    ostatnieKlikniecia = [];
  }
}

function odblokujTrybAdmina(){
  trybAdmina = true;
  clearTimeout(trybAdminaTimer);
  trybAdminaTimer = setTimeout(() => { trybAdmina = false; }, CZAS_ODBLOKOWANIA_MS);
}

function zablokujTrybAdmina(){
  trybAdmina = false;
  clearTimeout(trybAdminaTimer);
}

function dodajDoKoszyka(produkt){
  const wpis = koszyk.get(produkt.nazwa) || {produkt, ilosc:0};
  wpis.ilosc += 1;
  koszyk.set(produkt.nazwa, wpis);
  odswiezParagon();
}

function odswiezParagon(){
  const lista = document.getElementById('lista');
  const sumaEl = document.getElementById('suma');
  lista.innerHTML = '';
  let suma = 0;
  if (koszyk.size === 0){
    lista.innerHTML = '<div class="pusto">Dotknij produktu poniżej</div>';
  } else {
    for (const {produkt, ilosc} of koszyk.values()){
      const wartosc = produkt.cena * ilosc;
      suma += wartosc;
      const row = document.createElement('div');
      row.className = 'pozycja';
      row.innerHTML = `<img src="${produkt.img}" style="width:18px;height:18px;object-fit:contain;vertical-align:-3px;"> ${produkt.nazwa} ×${ilosc} — ${wartosc.toFixed(2)} zł`;
      lista.appendChild(row);
    }
  }
  sumaEl.textContent = `${suma.toFixed(2).replace('.',',')} zł`;
  sumaEl.classList.remove('pulse'); void sumaEl.offsetWidth; sumaEl.classList.add('pulse');
}

// KOMUNIKACJA Z DRUKARKĄ — WebUSB + Web Serial, szerokie przeszukiwanie
// ---------------------------------------------------------------
let backend = null;       // 'usb' | 'serial' | null
let usbDevice = null;
let usbEndpointOut = null;
let serialPort = null;
let serialWriter = null;

const PREDKOSCI_DO_PROBY = [9600, 19200, 38400, 57600, 115200];

function polaczonoZDrukarka(){
  return (backend === 'usb' && usbDevice) || (backend === 'serial' && serialPort);
}

async function probujUsbDevice(device){
  try{
    if (!device.opened) await device.open();
    if (device.configuration === null){
      await device.selectConfiguration(1);
    }
    for (const iface of device.configuration.interfaces){
      for (const alt of iface.alternates){
        const out = alt.endpoints.find(e => e.direction === 'out');
        if (out){
          try{
            await device.claimInterface(iface.interfaceNumber);
            usbDevice = device;
            usbEndpointOut = out.endpointNumber;
            backend = 'usb';
            return true;
          }catch(e){ /* zajete - probuj kolejny interfejs/urzadzenie */ }
        }
      }
    }
  }catch(e){ /* probuj kolejne urzadzenie */ }
  return false;
}

async function probujSerialPort(port){
  for (const baud of PREDKOSCI_DO_PROBY){
    try{
      await port.open({baudRate: baud});
      serialPort = port;
      serialWriter = port.writable.getWriter();
      backend = 'serial';
      return true;
    }catch(e){
      try{ await port.close(); }catch(_){}
    }
  }
  return false;
}

/**
 * Pelne przeszukanie: najpierw wszystkie juz autoryzowane urzadzenia
 * (bez pytania uzytkownika), a jesli pytajUzytkownika=true i nic nie
 * znaleziono - poprosi o wybranie nowego urzadzenia (USB, a pozniej serial).
 */
async function szukajDrukarki(pytajUzytkownika){
  ustawStatus('USB: szukam…', '');

  if ('usb' in navigator){
    try{
      const znane = await navigator.usb.getDevices();
      for (const d of znane){
        if (await probujUsbDevice(d)){ ustawStatus('USB: połączono ✅', 'ok'); return true; }
      }
    }catch(e){}
  }

  if ('serial' in navigator){
    try{
      const porty = await navigator.serial.getPorts();
      for (const p of porty){
        if (await probujSerialPort(p)){ ustawStatus('Serial: połączono ✅', 'ok'); return true; }
      }
    }catch(e){}
  }

  if (!pytajUzytkownika){
    ustawStatus('USB: niepołączono', '');
    return false;
  }

  if ('usb' in navigator){
    try{
      const d = await navigator.usb.requestDevice({filters:[]});
      if (await probujUsbDevice(d)){ ustawStatus('USB: połączono ✅', 'ok'); return true; }
      pokazKomunikat('Znaleziono urządzenie, ale nie udało się przejąć do niego dostępu.');
    }catch(e){ /* uzytkownik anulowal wybor albo brak urzadzen USB */ }
  }

  if ('serial' in navigator){
    try{
      const p = await navigator.serial.requestPort();
      if (await probujSerialPort(p)){ ustawStatus('Serial: połączono ✅', 'ok'); return true; }
      pokazKomunikat('Znaleziono port, ale żadna z typowych prędkości transmisji nie zadziałała.');
    }catch(e){ /* uzytkownik anulowal wybor portu szeregowego */ }
  }

  if (!('usb' in navigator) && !('serial' in navigator)){
    pokazKomunikat('Ta przeglądarka nie obsługuje ani WebUSB, ani Web Serial. Otwórz stronę w Chrome.');
  }
  ustawStatus('USB: nie znaleziono', 'err');
  return false;
}

async function wyslijBajty(bytes){
  try{
    if (backend === 'usb' && usbDevice){
      await usbDevice.transferOut(usbEndpointOut, bytes);
      return true;
    }
    if (backend === 'serial' && serialWriter){
      await serialWriter.write(bytes);
      return true;
    }
  }catch(err){
    ustawStatus('USB: błąd wysyłki', 'err');
    pokazKomunikat('Drukarka odłączyła się w trakcie druku.');
    backend = null; usbDevice = null; serialPort = null;
  }
  return false;
}

// przy starcie strony - sprobuj polaczyc sie po cichu z juz autoryzowanym urzadzeniem
window.addEventListener('load', () => { szukajDrukarki(false); });

// --- budowniczy komend ESC/POS ---
function polaczBajty(...tablice){
  const dlugosc = tablice.reduce((s,a) => s + a.length, 0);
  const wynik = new Uint8Array(dlugosc);
  let offset = 0;
  for (const t of tablice){ wynik.set(t, offset); offset += t.length; }
  return wynik;
}

const MAPA_PL = {
  'ą':'a','ć':'c','ę':'e','ł':'l','ń':'n','ó':'o','ś':'s','ź':'z','ż':'z',
  'Ą':'A','Ć':'C','Ę':'E','Ł':'L','Ń':'N','Ó':'O','Ś':'S','Ź':'Z','Ż':'Z'
};
function tekstDoBajtow(str){
  const bezOgonkow = str.split('').map(ch => MAPA_PL[ch] ?? ch).join('');
  const arr = new Uint8Array(bezOgonkow.length);
  for (let i=0;i<bezOgonkow.length;i++) arr[i] = bezOgonkow.charCodeAt(i) & 0xFF;
  return arr;
}

function escposInit(){ return new Uint8Array([0x1B,0x40]); }
function escposAlign(n){ return new Uint8Array([0x1B,0x61,n]); } // 0=left 1=center
function escposBold(n){ return new Uint8Array([0x1B,0x45,n]); }
function escposDouble(n){ return new Uint8Array([0x1D,0x21, n?0x11:0x00]); }
function escposFeed(n){ return new Uint8Array([0x1B,0x64,n]); }
function escposCut(){ return new Uint8Array([0x1D,0x56,0x00]); }

// konwersja obrazka <img> na komende rastra GS v 0
function obrazDoRastra(img){
  const canvas = document.createElement('canvas');
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const {width, height} = canvas;
  const imgData = ctx.getImageData(0,0,width,height).data;
  const widthBytes = Math.ceil(width/8);
  const dane = new Uint8Array(widthBytes*height);

  for (let y=0; y<height; y++){
    for (let xb=0; xb<widthBytes; xb++){
      let byteVal = 0;
      for (let bit=0; bit<8; bit++){
        const x = xb*8+bit;
        if (x < width){
          const idx = (y*width+x)*4;
          const lum = (imgData[idx]+imgData[idx+1]+imgData[idx+2])/3;
          const alpha = imgData[idx+3];
          if (lum < 128 && alpha > 100) byteVal |= (1 << (7-bit));
        }
      }
      dane[xb + y*widthBytes] = byteVal;
    }
  }
  const header = new Uint8Array([
    0x1D,'v'.charCodeAt(0),'0'.charCodeAt(0),0x00,
    widthBytes & 0xFF, (widthBytes>>8) & 0xFF,
    height & 0xFF, (height>>8) & 0xFF
  ]);
  return polaczBajty(header, dane);
}

async function drukujParagon(){
  if (koszyk.size === 0){
    dzwiekBledu();
    pokazKomunikat('Koszyk jest pusty — dotknij najpierw jakiś produkt.');
    return;
  }

  const pozycje = [...koszyk.values()];
  let suma = 0;
  pozycje.forEach(({produkt, ilosc}) => suma += produkt.cena * ilosc);

  const trybBezDrukarki = odczytajDane('trybBezDrukarki', false);

  if (trybBezDrukarki){
    dzwiekSukcesu();
    pokazParagonNaEkranie(pozycje, suma);
    koszyk.clear();
    odswiezParagon();
    return;
  }

  if (!polaczonoZDrukarka()){
    const ok = await szukajDrukarki(true);
    if (!ok){
      // brak drukarki - nie przerywamy zabawy, pokazujemy paragon na ekranie
      dzwiekSukcesu();
      pokazParagonNaEkranie(pozycje, suma);
      koszyk.clear();
      odswiezParagon();
      return;
    }
  }

  const logoImg = document.querySelector('header img');
  let liniePozycji = new Uint8Array(0);
  pozycje.forEach(({produkt, ilosc}) => {
    const wartosc = produkt.cena * ilosc;
    const linia = `${produkt.nazwa.padEnd(16)} x${ilosc}  ${wartosc.toFixed(2).padStart(6)} zl\n`;
    liniePozycji = polaczBajty(liniePozycji, tekstDoBajtow(linia));
  });

  const pakiet = polaczBajty(
    escposInit(),
    escposAlign(1),
    obrazDoRastra(logoImg),
    tekstDoBajtow('\n'),
    escposAlign(0),
    liniePozycji,
    tekstDoBajtow('--------------------------------\n'),
    escposBold(1), escposDouble(1),
    tekstDoBajtow(`SUMA: ${suma.toFixed(2)} zl\n`),
    escposDouble(0), escposBold(0),
    tekstDoBajtow('\n'),
    escposAlign(1),
    tekstDoBajtow('Zapraszam ponownie\n'),
    escposFeed(4),
    escposCut()
  );

  const wyslano = await wyslijBajty(pakiet);
  if (wyslano){
    dzwiekSukcesu();
    animujCiecie();
    pokazKomunikat('Wydrukowano paragon! 🎉');
    koszyk.clear();
    odswiezParagon();
  } else {
    // wysylka nie powiodla sie w trakcie - rowniez pokaz paragon na ekranie
    dzwiekSukcesu();
    pokazParagonNaEkranie(pozycje, suma);
    koszyk.clear();
    odswiezParagon();
  }
}


function animujCiecie(){
  const rect = document.getElementById('cut-line').getBoundingClientRect();
  const sc = document.getElementById('scissors');
  sc.style.left = (rect.right - 30) + 'px';
  sc.style.top = (rect.top - 10) + 'px';
  sc.classList.remove('show'); void sc.offsetWidth; sc.classList.add('show');
}

// --- Wirtualny paragon na ekranie (gdy drukarka niedostepna) ---
let ukryjParagonTimer = null;
function pokazParagonNaEkranie(pozycje, suma){
  const overlay = document.getElementById('onscreenReceipt');
  const tresc = document.getElementById('onscreenReceiptBody');

  let html = '<div class="orLinia orNaglowek">Sklep u Ali</div>';
  pozycje.forEach(({produkt, ilosc}) => {
    const wartosc = produkt.cena * ilosc;
    html += `<div class="orLinia"><span>${produkt.nazwa} ×${ilosc}</span><span>${wartosc.toFixed(2)} zł</span></div>`;
  });
  html += `<div class="orKreska"></div>`;
  html += `<div class="orSuma">SUMA: ${suma.toFixed(2)} zł</div>`;
  html += `<div class="orStopka">Zapraszam ponownie</div>`;
  tresc.innerHTML = html;

  overlay.classList.add('show');
  clearTimeout(ukryjParagonTimer);
  ukryjParagonTimer = setTimeout(() => overlay.classList.remove('show'), 7000);
}
document.getElementById('onscreenReceipt').addEventListener('click', () => {
  document.getElementById('onscreenReceipt').classList.remove('show');
  clearTimeout(ukryjParagonTimer);
});

document.getElementById('btnDrukuj').addEventListener('click', drukujParagon);

// MAPOWANIE FIZYCZNEJ KLAWIATURY
// ---------------------------------------------------------------
// Sloty odpowiadaja przyciskom widocznym na zdjeciu kasy.
// "code" to identyfikator faktycznie zlapany z klawisza (e.key lub e.code) -
// null dopoki uzytkownik nie uzyje "Nasluchuj" w ustawieniach.
const KEY_SLOTS = [
  {id:'k7', label:'7', code:'7'},
  {id:'k8', label:'8', code:'8'},
  {id:'k9', label:'9', code:'9'},
  {id:'k4', label:'4', code:'4'},
  {id:'k5', label:'5', code:'5'},
  {id:'k6', label:'6', code:'6'},
  {id:'k1', label:'1', code:'1'},
  {id:'k2', label:'2', code:'2'},
  {id:'k3', label:'3', code:'3'},
  {id:'k0', label:'0', code:null},
  {id:'przecinek', label:',', code:null},
  {id:'kropki', label:'Przycisk z kropkami', code:null},
  {id:'esc', label:'ESC (czerwony)', code:null},
  {id:'papier', label:'Ikona rolki papieru', code:null},
  {id:'f', label:'F', code:null},
  {id:'waga', label:'X / Waga', code:null},
  {id:'cena', label:'Cena', code:null},
  {id:'kod', label:'Kod', code:null},
  {id:'razem', label:'Razem', code:null},
  {id:'ok', label:'OK (zielony)', code:null},
];

function buildActions(){
  const akcje = [{id:'brak', label:'— brak —'}];
  PRODUKTY.forEach((p, i) => akcje.push({id:'produkt_'+i, label:`Dodaj: ${p.nazwa}`}));
  akcje.push({id:'drukuj', label:'🖨️ Drukuj i utnij'});
  akcje.push({id:'wyczysc', label:'🗑️ Wyczyść koszyk'});
  return akcje;
}
const AKCJE = buildActions();

const DOMYSLNE_AKCJE = {
  k7:'produkt_0', k8:'produkt_1', k9:'produkt_2',
  k4:'produkt_3', k5:'produkt_4', k6:'produkt_5',
  k1:'produkt_6', k2:'produkt_7', k3:'produkt_8',
  k0:'brak', przecinek:'brak', kropki:'brak',
  esc:'wyczysc', papier:'brak', f:'brak', waga:'brak',
  cena:'brak', kod:'brak', razem:'brak', ok:'drukuj'
};

// bezpieczne przechowywanie - dziala w prawdziwej przegladarce (localStorage),
// a jesli podglad jest w piaskownicy (np. w Claude.ai) - ciche przejscie na pamiec w JS
const pamiecFallback = {};
function zapiszDane(klucz, wartosc){
  try{ localStorage.setItem(klucz, JSON.stringify(wartosc)); }
  catch(e){ pamiecFallback[klucz] = wartosc; }
}
function odczytajDane(klucz, domyslna){
  try{
    const v = localStorage.getItem(klucz);
    return v !== null ? JSON.parse(v) : domyslna;
  }catch(e){
    return pamiecFallback[klucz] !== undefined ? pamiecFallback[klucz] : domyslna;
  }
}

let mapowanie = odczytajDane('mapowanieKlawiszy', null);
if (!mapowanie){
  mapowanie = {};
  KEY_SLOTS.forEach(s => {
    mapowanie[s.id] = {code:s.code, action: DOMYSLNE_AKCJE[s.id] || 'brak'};
  });
  zapiszDane('mapowanieKlawiszy', mapowanie);
} else {
  // uzupelnij ewentualne nowe sloty, ktorych brakuje w starym zapisie
  KEY_SLOTS.forEach(s => {
    if (!mapowanie[s.id]) mapowanie[s.id] = {code:s.code, action: DOMYSLNE_AKCJE[s.id] || 'brak'};
  });
}

let nasluchujacySlot = null;

function wykonajAkcje(action){
  if (!action || action === 'brak') return;
  if (action === 'drukuj'){ drukujParagon(); return; }
  if (action === 'wyczysc'){ dzwiekWyczyszczenia(); koszyk.clear(); odswiezParagon(); return; }
  if (action.startsWith('produkt_')){
    const idx = parseInt(action.split('_')[1], 10);
    if (PRODUKTY[idx]){ dzwiekDotkniecia(); dodajDoKoszyka(PRODUKTY[idx]); }
  }
}

document.addEventListener('keydown', (e) => {
  // tryb przechwytywania w ustawieniach
  if (nasluchujacySlot){
    mapowanie[nasluchujacySlot].code = e.key;
    zapiszDane('mapowanieKlawiszy', mapowanie);
    renderujListeKlawiszy();
    nasluchujacySlot = null;
    e.preventDefault();
    return;
  }
  // jesli ustawienia otwarte - nie wykonuj akcji sprzedazowych
  if (document.getElementById('settingsOverlay').classList.contains('show')) return;

  for (const id in mapowanie){
    const wpis = mapowanie[id];
    if (wpis.code !== null && wpis.code === e.key){
      wykonajAkcje(wpis.action);
      break;
    }
  }
});

function renderujListeKlawiszy(){
  const kontener = document.getElementById('keyList');
  kontener.innerHTML = '';
  KEY_SLOTS.forEach(slot => {
    const wpis = mapowanie[slot.id];
    const row = document.createElement('div');
    row.className = 'keyrow';

    const label = document.createElement('div');
    label.className = 'keylabel';
    label.textContent = slot.label;

    const listenBtn = document.createElement('button');
    listenBtn.className = 'listenBtn';
    listenBtn.textContent = 'Nasłuchuj';
    listenBtn.addEventListener('click', () => {
      document.querySelectorAll('.listenBtn').forEach(b => { b.classList.remove('listening'); b.textContent='Nasłuchuj'; });
      nasluchujacySlot = slot.id;
      listenBtn.classList.add('listening');
      listenBtn.textContent = 'Naciśnij klawisz...';
    });

    const codeSpan = document.createElement('div');
    codeSpan.className = 'capturedCode';
    codeSpan.textContent = wpis.code ? `[${wpis.code}]` : '(brak)';

    const select = document.createElement('select');
    AKCJE.forEach(a => {
      const opt = document.createElement('option');
      opt.value = a.id;
      opt.textContent = a.label;
      if (a.id === wpis.action) opt.selected = true;
      select.appendChild(opt);
    });
    select.addEventListener('change', () => {
      mapowanie[slot.id].action = select.value;
      zapiszDane('mapowanieKlawiszy', mapowanie);
    });

    row.appendChild(label);
    row.appendChild(listenBtn);
    row.appendChild(codeSpan);
    row.appendChild(select);
    kontener.appendChild(row);
  });
}

document.getElementById('btnSzukaj').addEventListener('click', async () => {
  if (!trybAdmina) return; // zablokowane bez sekretnej sekwencji - celowo brak jakiejkolwiek reakcji
  zablokujTrybAdmina();
  const znaleziono = await szukajDrukarki(true);

document.getElementById('btnSettings').addEventListener('click', () => {
  if (!trybAdmina) return; // zablokowane bez sekretnej sekwencji - celowo brak jakiejkolwiek reakcji
  zablokujTrybAdmina();
  renderujListeKlawiszy();

});
document.getElementById('chkBezDrukarki').addEventListener('change', (e) => {
  zapiszDane('trybBezDrukarki', e.target.checked);
});
document.getElementById('chkDzwieki').addEventListener('change', (e) => {
  zapiszDane('dzwiekiWlaczone', e.target.checked);
});

  document.getElementById('settingsOverlay').classList.remove('show');

document.getElementById('btnZapisz').addEventListener('click', () => {
  document.getElementById('settingsOverlay').classList.remove('show');

});
document.getElementById('btnReset').addEventListener('click', () => {
  KEY_SLOTS.forEach(s => { mapowanie[s.id] = {code:s.code, action: DOMYSLNE_AKCJE[s.id] || 'brak'}; });
  zapiszDane('mapowanieKlawiszy', mapowanie);
  renderujListeKlawiszy();
  pokazKomunikat('Przywrócono domyślne ustawienia.');
});
