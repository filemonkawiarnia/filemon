<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Filemon</title>
<style>
  :root {
    --navy:   #2C3E6A;
    --green:  #1DB96A;
    --red:    #E84040;
    --bg:     #F0EDF8;
    --card:   #FFFFFF;
    --text:   #1B2A4A;
    --muted:  #7A8AAA;
    --border: rgba(27,42,74,0.12);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 2rem;
  }
  header {
    background: var(--navy);
    padding: 1.2rem 1.5rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }
  .header-text h1 { color:#fff; font-size:1.05rem; font-weight:700; }
  .header-text p  { color:rgba(255,255,255,0.5); font-size:0.72rem; margin-top:0.1rem; text-transform:uppercase; letter-spacing:0.08em; }

  .section { margin: 1.2rem 1rem 0; }
  .section-label {
    font-size: 0.7rem; font-weight:700; text-transform:uppercase;
    letter-spacing:0.12em; color:var(--muted); margin-bottom:0.6rem;
  }
  .card {
    background: var(--card); border-radius:16px;
    padding: 1rem 1.1rem;
    box-shadow: 0 2px 12px rgba(27,42,74,0.08);
  }
  .info-row {
    display:flex; justify-content:space-between; align-items:center;
    padding: 0.45rem 0; border-bottom: 1px solid var(--border); font-size:0.9rem;
  }
  .info-row:last-child { border-bottom:none; }
  .info-label { color:var(--muted); font-size:0.78rem; }
  .info-value { font-weight:600; text-align:right; }

  .sms-bubble {
    background: #e5e5ea;
    border-radius: 16px 16px 4px 16px;
    padding: 0.9rem 1rem;
    font-size: 0.93rem;
    line-height: 1.6;
    color: #1c1c1e;
    white-space: pre-wrap;
    word-break: break-word;
    user-select: all;
    -webkit-user-select: all;
  }
  .sms-bubble.confirm { background: #d1f2e0; }
  .sms-bubble.deny    { background: #fde8e8; }

  .sms-btn {
    display: flex; align-items:center; justify-content:center; gap:0.5rem;
    width: 100%; margin-top: 0.65rem;
    padding: 0.85rem; border:none; border-radius:12px;
    font-size: 0.95rem; font-weight:700; cursor:pointer;
    transition: opacity 0.15s, transform 0.1s;
    font-family: inherit; text-decoration:none; color:#fff;
  }
  .sms-btn:active { transform:scale(0.97); opacity:0.85; }
  .sms-btn.confirm { background: var(--green); }
  .sms-btn.deny    { background: var(--red); }
  .sms-btn:disabled { opacity:0.5; cursor:default; }

  .btn-row { display:flex; gap:0.6rem; margin-top:0.65rem; }
  .btn-row .sms-btn { margin-top:0; width:auto; flex:1 1 auto; }
  .sms-btn.edit-btn { background: var(--navy); flex:0 0 auto; width:auto; padding:0.85rem 1rem; }
  .sms-btn.star-btn { background: #E8A73A; flex:0 0 auto; width:auto; padding:0.85rem 1rem; }
  .sms-btn.star-btn.active { background: #B87F1E; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.6); }
  .sms-btn.doc-btn { background: #9AA5B8; flex:0 0 auto; width:auto; padding:0.85rem 1rem; }
  .sms-btn.doc-btn.active { background: #4A6FA5; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.6); }
  .sms-btn.lang-btn { background: #9AA5B8; flex:0 0 auto; width:auto; padding:0.85rem 1rem; }
  .sms-btn.lang-btn.active { background: #2C7A4B; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.6); }
  .sms-btn.cancel-btn { background: var(--muted); }
  .sms-btn.save-btn { background: var(--navy); }

  .sms-edit {
    width:100%; font-family:inherit; font-size:0.93rem; line-height:1.6;
    color:#1c1c1e; border-radius:16px; border:1px solid var(--border);
    padding:0.9rem 1rem; resize:vertical; min-height:120px;
    background:#fff;
  }
  .edit-actions { display:flex; gap:0.6rem; margin-top:0.65rem; }
  .edit-actions .sms-btn { margin-top:0; }

  .copied-toast {
    position:fixed; bottom:1.5rem; left:50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--navy); color:#fff;
    padding: 0.6rem 1.4rem; border-radius:30px;
    font-size:0.85rem; font-weight:600;
    opacity:0; pointer-events:none;
    transition: opacity 0.2s, transform 0.2s;
    z-index:100; white-space:nowrap;
  }
  .copied-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .tip { font-size:0.7rem; color:var(--muted); text-align:center; margin-top:0.4rem; }
  .error { text-align:center; padding:3rem 1rem; color:var(--muted); }

  .popup-overlay {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,0.45); z-index:200;
    align-items:center; justify-content:center;
  }
  .popup-overlay.show { display:flex; }
  .popup-box {
    background:#fff; border-radius:20px;
    padding:2rem 1.5rem; margin:1.5rem;
    text-align:center; max-width:320px; width:100%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .popup-icon { font-size:3rem; margin-bottom:0.5rem; }
  .popup-title { font-size:1.15rem; font-weight:700; margin-bottom:0.4rem; }
  .popup-desc { font-size:0.88rem; color:var(--muted); margin-bottom:1.2rem; line-height:1.5; }
  .popup-close {
    background:var(--navy); color:#fff; border:none;
    padding:0.75rem 2rem; border-radius:12px;
    font-size:0.95rem; font-weight:700; cursor:pointer;
    font-family:inherit; width:100%;
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="header-text">
      <h1>Filemon</h1>
    </div>
  </div>
</header>

<div id="app"></div>
<div class="copied-toast" id="toast">✓ Skopiowano!</div>

<div class="popup-overlay" id="popup">
  <div class="popup-box">
    <div class="popup-icon" id="popup-icon">✅</div>
    <div class="popup-title" id="popup-title">SMS wysłany!</div>
    <div class="popup-desc" id="popup-desc"></div>
    <button class="popup-close" id="popup-btn-ok" onclick="document.getElementById('popup').classList.remove('show')">OK</button>
    <div class="popup-actions" id="popup-actions" style="display:none; gap:0.6rem;">
      <button class="popup-close" id="popup-btn-nie" style="background:var(--muted);">Nie</button>
      <button class="popup-close" id="popup-btn-tak" style="background:var(--green);">Tak, dodaj</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, updateDoc, getDocs, getDoc }
  from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBOGm3N-8zPtjvVv7hx1F-jqFpBU-dD7RY",
  authDomain: "rezerwacja-af82e.firebaseapp.com",
  projectId: "rezerwacja-af82e",
  storageBucket: "rezerwacja-af82e.firebasestorage.app",
  messagingSenderId: "316318620114",
  appId: "1:316318620114:web:453d19957ab0af4f8b100b"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

const p    = new URLSearchParams(location.search);
const tel  = p.get('tel')  || '';
// Numer kierunkowy (same cyfry, bez '+' i flagi), np. "48", "44", "380".
// Przekazywany z formularza na index.html — brak parametru = stare linki = Polska.
const kraj = p.get('kraj') || '48';
const czyPolski = kraj === '48';
// Gdy link otwierany jest z rez.html (rezerwacja wpisana ręcznie), rezerwacja
// jest już w grafiku — nie wolno jej dodawać drugi raz po wysłaniu SMS-a.
const jestJuzWGrafiku = p.get('jest_w_grafiku') === '1';
// ID rezerwacji w kolekcji 'reservations' (przekazywany tylko przy wpisie ręcznym
// z rez.html) — po udanej wysyłce SMS oznaczamy tę rezerwację jako smsSent,
// żeby przycisk w rez.html mógł się automatycznie zablokować.
const resId = p.get('resId') || '';
// Usuwa polskie znaki (ą→a, ę→e, itd.)
function bezOgonkow(str) {
  return str
    .replace(/ą/g,'a').replace(/Ą/g,'A')
    .replace(/ć/g,'c').replace(/Ć/g,'C')
    .replace(/ę/g,'e').replace(/Ę/g,'E')
    .replace(/ł/g,'l').replace(/Ł/g,'L')
    .replace(/ń/g,'n').replace(/Ń/g,'N')
    .replace(/ó/g,'o').replace(/Ó/g,'O')
    .replace(/ś/g,'s').replace(/Ś/g,'S')
    .replace(/ź/g,'z').replace(/Ź/g,'Z')
    .replace(/ż/g,'z').replace(/Ż/g,'Z');
}

const imiePelne = p.get('imie') || '';
const imie = bezOgonkow(imiePelne.split(' ')[0]);
const dataRez = p.get('data') || '';
const dataISO = p.get('dataISO') || '';
const godz = p.get('godz') || '';
const osobyText = p.get('osoby') || '';
const osoby = parseInt(p.get('osoby')) || 1;
const dzieci = parseInt(p.get('dzieci')) || 0;
const uwagi = p.get('uwagi') || '';

// Wiek najmłodszego dziecka w rezerwacji (jeśli przekazany przez formularz) —
// używany do przypomnienia o dokumencie potrzebnym do weryfikacji wieku (8-11 lat).
// W niedziele wiek dzieci nie ma znaczenia, więc przypomnienie nigdy się nie pojawia.
const wiekNajmlodszegoRaw = p.get('wiek_najmlodszego');
const wiekNajmlodszego = (wiekNajmlodszegoRaw !== null && wiekNajmlodszegoRaw !== '')
  ? parseInt(wiekNajmlodszegoRaw)
  : NaN;
const isNiedziela = dataRez.toLowerCase().includes('niedziela');
const potrzebnyDokument = !isNiedziela && !isNaN(wiekNajmlodszego) && wiekNajmlodszego >= 8 && wiekNajmlodszego <= 11;

// ─── TELEFON: te same reguły co w rez.html, żeby klienci z rezerwacji online
// i wpisywani ręcznie zawsze trafiali do JEDNEGO rekordu w bazie ───
function phoneDigits(val){
  let d=(val||'').replace(/\D/g,'');
  if (czyPolski) {
    if(d.startsWith('0048'))d=d.slice(4);
    else if(d.startsWith('48')&&d.length>9)d=d.slice(2);
    return d.slice(0,9);
  }
  // Numer zagraniczny — zdejmij tylko prefiks kierunkowego, nie obcinaj
  // długości (polskie 9 cyfr to za mało dla większości innych krajów).
  if (kraj && d.startsWith(kraj)) d = d.slice(kraj.length);
  return d;
}
function formatPhone(val){
  const d=phoneDigits(val);
  const parts=[];
  if(d.length>0)parts.push(d.slice(0,3));
  if(d.length>3)parts.push(d.slice(3,6));
  if(d.length>6)parts.push(d.slice(6,9));
  return parts.join('-');
}
const telFormatted = formatPhone(tel);

// ─── KLUCZ LINKU: identyfikuje TĘ konkretną rezerwację (telefon+data+godzina)
// niezależnie od urządzenia, z którego link jest otwierany — dzięki temu
// blokada "już wysłano" działa globalnie (w Firestore), a nie tylko lokalnie ───
const linkKey = (tel && dataISO && godz)
  ? `${phoneDigits(tel)}_${dataISO}_${godz}`.replace(/[^a-zA-Z0-9_-]/g, '')
  : '';

async function sprawdzWyslanieLinku() {
  if (!linkKey) return;
  try {
    const snap = await getDoc(doc(db, 'smsWyslane', linkKey));
    if (snap.exists()) zablokujWyslijPoWyslaniu(snap.data());
  } catch (e) {
    console.error('Nie udało się sprawdzić statusu wysyłki SMS:', e);
  }
}

function zablokujWyslijPoWyslaniu(dane) {
  ['confirm', 'deny'].forEach(t => {
    const btn = document.getElementById('btn-' + t);
    if (btn) { btn.disabled = true; btn.style.opacity = '0.4'; }
    const editBtn = document.querySelector('#btn-row-' + t + ' .edit-btn');
    if (editBtn) editBtn.disabled = true;
  });
  const starBtn = document.getElementById('btn-star-confirm');
  if (starBtn) starBtn.disabled = true;
  const docBtn = document.getElementById('btn-doc-confirm');
  if (docBtn) docBtn.disabled = true;
  const langBtn = document.getElementById('btn-lang-confirm');
  if (langBtn) langBtn.disabled = true;
  const firstSection = document.querySelector('.section');
  if (firstSection) {
    const banner = document.createElement('div');
    banner.style.cssText = 'margin:0 0 1rem 0;border-left:4px solid #E8A73A;background:#FFF7E8;color:#7A5200;padding:0.85rem 1rem;border-radius:8px;font-size:0.9rem;line-height:1.4;';
    const kiedy = dane.wyslanoO ? new Date(dane.wyslanoO).toLocaleString('pl-PL') : '';
    banner.textContent = `⚠️ SMS (${dane.typ === 'confirm' ? 'potwierdzenie' : 'brak miejsc'}) został już wysłany dla tej rezerwacji${kiedy ? ' — ' + kiedy : ''}. Wysyłka z tego linku jest zablokowana, także z innych urządzeń.`;
    firstSection.parentNode.insertBefore(banner, firstSection);
    if (dane.tresc) {
      const trescBox = document.createElement('div');
      trescBox.style.cssText = 'margin:0.6rem 0 1rem 0;padding:0.75rem 1rem;background:#F5F5F5;border-radius:8px;font-size:0.85rem;line-height:1.4;color:#444;white-space:pre-wrap;';
      trescBox.textContent = `Treść wysłanej wiadomości: "${dane.tresc}"`;
      firstSection.parentNode.insertBefore(trescBox, firstSection);
    }
  }

  const kiedyPopup = dane.wyslanoO ? new Date(dane.wyslanoO).toLocaleString('pl-PL') : '';
  document.getElementById('popup-icon').textContent  = '⚠️';
  document.getElementById('popup-title').textContent = 'SMS już wysłany';
  document.getElementById('popup-desc').textContent  =
    `Wiadomość "${dane.typ === 'confirm' ? 'Potwierdzenie' : 'Brak miejsc'}" została już wysłana`
    + (kiedyPopup ? ` - ${kiedyPopup}` : '')
    + `.\n\nNie wysyłaj sms-a ponownie.`
    + (dane.tresc ? `\n\nTreść: "${dane.tresc}"` : '');
  document.getElementById('popup').classList.add('show');
}

async function upsertClient(name, phone) {
  try {
    const snap = await getDocs(collection(db, 'clients'));
    let found = null;
    snap.forEach(d => {
      const c = d.data();
      // Dopasowanie PRZEDE WSZYSTKIM po telefonie (nie po imieniu) — dzięki temu
      // "Anna" i "Ania" z tym samym numerem trafiają do tego samego klienta.
      if (phone && c.phone && phoneDigits(c.phone) === phoneDigits(phone)) found = {id:d.id, ...c};
      else if (!found && !phone && c.name && c.name.toLowerCase() === name.toLowerCase()) found = {id:d.id, ...c};
    });
    if (found) {
      await updateDoc(doc(db,'clients',found.id), {name, phone: phone || found.phone || '', reservations:(found.reservations||0)+1});
    } else {
      const id = uid();
      await setDoc(doc(db,'clients',id), {id, name, phone, reservations:1, noShows:0});
    }
  } catch(e) { /* nie blokuj zapisu rezerwacji błędem klienta */ }
}

async function dodajRezerwacjeDoBazy() {
  if (!dataISO || !godz || !imiePelne) {
    return { ok:false, reason: `Brak danych w linku (dataISO="${dataISO}", godz="${godz}", imie="${imiePelne}")` };
  }
  try {
    const id = uid();
    const kidsAge = (dzieci > 0 && !isNaN(wiekNajmlodszego)) ? wiekNajmlodszego : null;
    await setDoc(doc(db, 'reservations', id), {
      id,
      date: dataISO,
      time: godz,
      name: imiePelne,
      adults: osoby,
      kids: dzieci,
      kidsAge,
      phone: telFormatted,
      table: '',
      notes: uwagi,
      noShow: false
    });
    await upsertClient(imiePelne, telFormatted);
    return { ok:true };
  } catch(e) {
    console.error('Błąd zapisu rezerwacji do Firestore:', e);
    return { ok:false, reason: (e && (e.code || e.message)) ? `${e.code || ''} ${e.message || e}`.trim() : String(e) };
  }
}

const SMSAPI_TOKEN  = 'l50OnvURxYvcbkIY2wjtGUQsWSRXUW6bXOniySO6';
const SMSAPI_SENDER = 'Filemon';

// Skraca datę z "29 czerwca (poniedziałek)" → "29-06 (pon)"
function skrocData(d) {
  const miesiaceMapa = {
    'stycznia':1,'lutego':2,'marca':3,'kwietnia':4,'maja':5,'czerwca':6,
    'lipca':7,'sierpnia':8,'września':9,'października':10,'listopada':11,'grudnia':12
  };
  const dniMapa = {
    'poniedziałek':'pon','wtorek':'wt','środa':'sro','czwartek':'czw',
    'piątek':'pt','sobota':'sob','niedziela':'nd'
  };
  // Format: "29 czerwca (poniedziałek)"
  const m = d.match(/(\d+)\s+(\S+)\s*\((\S+)\)/);
  if (m) {
    const dzien = m[1].padStart(2,'0');
    const mies  = String(miesiaceMapa[m[2].toLowerCase()] || m[2]).padStart(2,'0');
    const dz    = dniMapa[m[3].toLowerCase()] || m[3];
    return `${dzien}-${mies} (${dz})`;
  }
  return d; // jeśli format nieznany — zostaw bez zmian
}

const dataKrotka = skrocData(dataRez);

// Przypomnienie o dokumencie (gdy dotyczy) dopisywane jest jako dodatkowa
// linijka POD linijką powitalną — sama linijka powitalna zostaje zawsze.
// Domyślnie włączone, gdy dotyczy (dziecko 8-11 lat, dzień powszedni) — można
// odznaczyć przyciskiem 👶, jeśli dopisek jest niepotrzebny.
let dokumentDopiskAktywny = potrzebnyDokument;

function buildLinieTresciPL() {
  return 'Do zobaczenia przy kawie i mruczeniu!'
    + (dokumentDopiskAktywny ? '\nPamietaj o dokumencie :)' : '');
}
function buildLinieTresciEN() {
  return 'See you soon for coffee and purring!'
    + (dokumentDopiskAktywny ? '\nPlease remember to bring an ID.' : '');
}

function buildTxtConfirmNormalPL() {
  return tel
    ? `Czesc, ${imie}!\n\nRezerwacja potwierdzona!\n${dataKrotka} o ${godz}\n${buildLinieTresciPL()}\n\nFilemon Kocia Kawiarnia`
    : '';
}
function buildTxtConfirmAltPL() {
  return tel
    ? `Czesc, ${imie}!\n\nRezerwacja potwierdzona!\n${dataKrotka} o ${godz}\nStolik dostepny tylko na 1h.\n${buildLinieTresciPL()}\n\nFilemon Kocia Kawiarnia`
    : '';
}
function buildTxtConfirmNormalEN() {
  return tel
    ? `Hi, ${imie}!\n\nYour reservation is confirmed!\n${dataKrotka} at ${godz}\n${buildLinieTresciEN()}\n\nFilemon Cat Cafe`
    : '';
}
function buildTxtConfirmAltEN() {
  return tel
    ? `Hi, ${imie}!\n\nYour reservation is confirmed!\n${dataKrotka} at ${godz}\nThe table is available for 1 hour only.\n${buildLinieTresciEN()}\n\nFilemon Cat Cafe`
    : '';
}

let altConfirmAktywny = false;
// Wersja angielska — domyślnie WŁĄCZONA dla numerów zagranicznych (kraj != Polska),
// dla polskich numerów opcja w ogóle się nie pojawia.
let jezykAngielskiAktywny = !czyPolski;

function buildTxtConfirm() {
  if (jezykAngielskiAktywny) {
    return altConfirmAktywny ? buildTxtConfirmAltEN() : buildTxtConfirmNormalEN();
  }
  return altConfirmAktywny ? buildTxtConfirmAltPL() : buildTxtConfirmNormalPL();
}

let txtConfirm = buildTxtConfirm();

function odswiezBubkeConfirm() {
  txtConfirm = buildTxtConfirm();
  document.getElementById('bubble-confirm').textContent = txtConfirm;
  document.getElementById('edit-confirm').value = txtConfirm;
}

window.przelaczAltSMS = function() {
  altConfirmAktywny = !altConfirmAktywny;
  odswiezBubkeConfirm();
  document.getElementById('btn-star-confirm').classList.toggle('active', altConfirmAktywny);
};

window.przelaczDokumentDopisek = function() {
  dokumentDopiskAktywny = !dokumentDopiskAktywny;
  odswiezBubkeConfirm();
  document.getElementById('btn-doc-confirm').classList.toggle('active', dokumentDopiskAktywny);
};

window.przelaczJezykSMS = function() {
  jezykAngielskiAktywny = !jezykAngielskiAktywny;
  odswiezBubkeConfirm();
  document.getElementById('btn-lang-confirm').classList.toggle('active', jezykAngielskiAktywny);
};

let txtDeny = tel
  ? `Czesc, ${imie}!\n\nNiestety ${dataKrotka} o ${godz} nie mamy wolnych stolikow.\nZadzwon do nas lub wybierz inny termin.\n\nFilemon Kocia Kawiarnia`
  : '';

// ─── EDYCJA TREŚCI SMS ───
window.edytujSMS = function(typ) {
  document.getElementById('bubble-' + typ).style.display = 'none';
  document.getElementById('btn-row-' + typ).style.display = 'none';
  document.getElementById('edit-' + typ).style.display = 'block';
  document.getElementById('edit-actions-' + typ).style.display = 'flex';
};

window.anulujEdycje = function(typ) {
  const tresc = typ === 'confirm' ? txtConfirm : txtDeny;
  document.getElementById('edit-' + typ).value = tresc;
  document.getElementById('edit-' + typ).style.display = 'none';
  document.getElementById('edit-actions-' + typ).style.display = 'none';
  document.getElementById('bubble-' + typ).style.display = 'block';
  document.getElementById('btn-row-' + typ).style.display = 'flex';
};

window.zapiszEdycje = function(typ) {
  const nowaTresc = document.getElementById('edit-' + typ).value;
  if (typ === 'confirm') txtConfirm = nowaTresc; else txtDeny = nowaTresc;
  document.getElementById('bubble-' + typ).textContent = nowaTresc;
  document.getElementById('edit-' + typ).style.display = 'none';
  document.getElementById('edit-actions-' + typ).style.display = 'none';
  document.getElementById('bubble-' + typ).style.display = 'block';
  document.getElementById('btn-row-' + typ).style.display = 'flex';
};

window.wyslijSMS = async function(typ) {
  const tresc = typ === 'confirm' ? txtConfirm : txtDeny;
  const btn = document.getElementById('btn-' + typ);
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Wysyłanie...';

  try {
    const res = await fetch('https://serwer2679123.hosting-home.pl/sms-proxy.php', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
      },
      body: new URLSearchParams({
        to:      tel,
        message: tresc,
        from:    SMSAPI_SENDER,
        format:  'json',
      })
    });

    const resp = await res.json();

    if (resp.count && resp.count > 0) {
      btn.textContent = '✓ Wysłano!';
      btn.style.background = '#1DB96A';
      const other = typ === 'confirm' ? 'deny' : 'confirm';
      const otherBtn = document.getElementById('btn-' + other);
      if (otherBtn) { otherBtn.disabled = true; otherBtn.style.opacity = '0.4'; }
      ['confirm','deny'].forEach(t => {
        const editBtn = document.querySelector('#btn-row-' + t + ' .edit-btn');
        if (editBtn) editBtn.disabled = true;
      });
      const starBtn = document.getElementById('btn-star-confirm');
      if (starBtn) starBtn.disabled = true;
      const docBtn = document.getElementById('btn-doc-confirm');
      if (docBtn) docBtn.disabled = true;
      const langBtn = document.getElementById('btn-lang-confirm');
      if (langBtn) langBtn.disabled = true;

      if (linkKey) {
        try {
          await setDoc(doc(db, 'smsWyslane', linkKey), {
            typ,
            wyslanoO: new Date().toISOString(),
            imie: imiePelne,
            tel: telFormatted,
            tresc
          });
        } catch (e) {
          console.error('Nie udało się zapisać statusu wysyłki SMS:', e);
        }
      }

      if (resId) {
        try {
          await updateDoc(doc(db, 'reservations', resId), {
            smsSent: true,
            smsType: typ,
            smsSentAt: new Date().toISOString()
          });
        } catch (e) {
          console.error('Nie udało się oznaczyć rezerwacji jako smsSent:', e);
        }
      }

      const isConfirm = typ === 'confirm';

      let zapisanoRezerwacje = { ok:false };
      if (isConfirm && !jestJuzWGrafiku) {
        zapisanoRezerwacje = await dodajRezerwacjeDoBazy();
      }

      document.getElementById('popup-icon').textContent  = isConfirm ? '✅' : '❌';
      document.getElementById('popup-title').textContent = 'SMS wysłany!';
      let opis = isConfirm
        ? 'Potwierdzenie rezerwacji zostało wysłane do ' + imie + '.'
        : 'Informacja o braku miejsc została wysłana do ' + imie + '.';
      if (isConfirm && !jestJuzWGrafiku) {
        opis += zapisanoRezerwacje.ok
          ? '\n\nRezerwacja została automatycznie dodana do grafiku.'
          : '\n\n⚠️ Nie udało się automatycznie dodać rezerwacji do grafiku — dodaj ją ręcznie.\n\nSzczegóły błędu: ' + zapisanoRezerwacje.reason;
      }
      document.getElementById('popup-desc').textContent = opis;
      document.getElementById('popup').classList.add('show');
    } else {
      throw new Error(JSON.stringify(resp));
    }
  } catch(e) {
    btn.disabled = false;
    btn.textContent = originalText;
    document.getElementById('popup-icon').textContent  = '⚠️';
    document.getElementById('popup-title').textContent = 'Błąd wysyłki';

    // Dodanie do grafiku ma sens tylko dla SMS-a "Potwierdzenie" i tylko gdy
    // rezerwacja nie jest już w grafiku (np. przy wpisie ręcznym z rez.html).
    const mozeDodacDoGrafiku = (typ === 'confirm') && !jestJuzWGrafiku;

    document.getElementById('popup-desc').textContent =
      'Nie udało się wysłać SMS. Spróbuj ponownie.\n\n' + e.message
      + (mozeDodacDoGrafiku ? '\n\nCzy mimo to dodać rezerwację do grafiku?' : '');

    if (mozeDodacDoGrafiku) {
      pokazPytanieDodajDoGrafiku();
    } else {
      pokazZwyklyPopup();
    }
    document.getElementById('popup').classList.add('show');
  }
}

// ─── Pokazanie zwykłego popupu z jednym przyciskiem OK ───
function pokazZwyklyPopup() {
  document.getElementById('popup-btn-ok').style.display = 'block';
  document.getElementById('popup-actions').style.display = 'none';
}

// ─── Popup błędu wysyłki SMS z pytaniem, czy mimo to dodać rezerwację
// do grafiku (np. gdy klient i tak wie/wiadomo ustnie, że stolik jest,
// a SMS z jakiegoś powodu nie poszedł) ───
function pokazPytanieDodajDoGrafiku() {
  document.getElementById('popup-btn-ok').style.display = 'none';
  const actions = document.getElementById('popup-actions');
  actions.style.display = 'flex';

  const btnTak = document.getElementById('popup-btn-tak');
  const btnNie = document.getElementById('popup-btn-nie');

  btnTak.disabled = false;
  btnTak.textContent = 'Tak, dodaj';

  btnTak.onclick = async function() {
    btnTak.disabled = true;
    btnTak.textContent = 'Dodawanie...';
    btnNie.disabled = true;
    const wynik = await dodajRezerwacjeDoBazy();
    pokazZwyklyPopup();
    document.getElementById('popup-icon').textContent  = wynik.ok ? '✅' : '⚠️';
    document.getElementById('popup-title').textContent = wynik.ok ? 'Dodano do grafiku' : 'Błąd zapisu';
    document.getElementById('popup-desc').textContent  = wynik.ok
      ? 'Rezerwacja została dodana do grafiku (mimo że SMS nie został wysłany).'
      : 'Nie udało się dodać rezerwacji do grafiku.\n\nSzczegóły błędu: ' + wynik.reason;
  };

  btnNie.onclick = function() {
    document.getElementById('popup').classList.remove('show');
    pokazZwyklyPopup();
  };
}

const app = document.getElementById('app');

if (!tel || !imie || !dataRez || !godz) {
  app.innerHTML = '<div class="error">Brak danych.</div>';
} else {
  app.innerHTML = `
    <div class="section">
      <div class="section-label">Dane rezerwacji</div>
      <div class="card">
        <div class="info-row"><span class="info-label">Gość</span><span class="info-value">${imie}</span></div>
        <div class="info-row"><span class="info-label">Liczba osób</span><span class="info-value">${dzieci > 0 ? `${osoby}+${dzieci}` : osobyText}</span></div>
        <div class="info-row"><span class="info-label">Telefon</span><span class="info-value">+${tel}</span></div>
        <div class="info-row"><span class="info-label">Data</span><span class="info-value">${dataRez}</span></div>
        <div class="info-row"><span class="info-label">Godzina</span><span class="info-value">${godz}</span></div>
        ${potrzebnyDokument ? `<div class="info-row"><span class="info-label">Uwaga</span><span class="info-value" style="color:var(--red)">Dziecko 8-11 lat — dopisano przypomnienie o dokumencie</span></div>` : ''}
      </div>
    </div>

    <div class="section">
      <div class="section-label">✅ Potwierdzenie</div>
      <div class="card">
        <div class="sms-bubble confirm" id="bubble-confirm">${txtConfirm}</div>
        <textarea class="sms-edit" id="edit-confirm" style="display:none;">${txtConfirm}</textarea>
        <div class="edit-actions" id="edit-actions-confirm" style="display:none;">
          <button class="sms-btn cancel-btn" onclick="anulujEdycje('confirm')">Anuluj</button>
          <button class="sms-btn save-btn" onclick="zapiszEdycje('confirm')">Zapisz</button>
        </div>
        <div class="btn-row" id="btn-row-confirm">
          <button id="btn-confirm" class="sms-btn confirm" onclick="wyslijSMS('confirm')">✅ Wyślij SMS — Potwierdzenie</button>
          <button id="btn-star-confirm" class="sms-btn star-btn" onclick="przelaczAltSMS()" title="Wersja: stolik dostępny tylko 1 godzinę">Tylko na 1h</button>
          <button id="btn-doc-confirm" class="sms-btn doc-btn${potrzebnyDokument ? ' active' : ''}" onclick="przelaczDokumentDopisek()" title="Dopisek: Pamiętaj o dokumencie">👶</button>
          ${!czyPolski ? `<button id="btn-lang-confirm" class="sms-btn lang-btn${jezykAngielskiAktywny ? ' active' : ''}" onclick="przelaczJezykSMS()" title="Wersja SMS-a w języku angielskim">🇬🇧 EN</button>` : ''}
          <button class="sms-btn edit-btn" onclick="edytujSMS('confirm')"> ✏️ </button>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-label">❌ Brak miejsc</div>
      <div class="card">
        <div class="sms-bubble deny" id="bubble-deny">${txtDeny}</div>
        <textarea class="sms-edit" id="edit-deny" style="display:none;">${txtDeny}</textarea>
        <div class="edit-actions" id="edit-actions-deny" style="display:none;">
          <button class="sms-btn cancel-btn" onclick="anulujEdycje('deny')">Anuluj</button>
          <button class="sms-btn save-btn" onclick="zapiszEdycje('deny')">Zapisz</button>
        </div>
        <div class="btn-row" id="btn-row-deny">
          <button id="btn-deny" class="sms-btn deny" onclick="wyslijSMS('deny')">❌ Wyślij SMS — Brak miejsc</button>
          <button class="sms-btn edit-btn" onclick="edytujSMS('deny')"> ✏️ </button>
        </div>
      </div>
    </div>
  `;
  sprawdzWyslanieLinku();
}
</script>
