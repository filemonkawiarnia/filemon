<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Filemon · Odpowiedź SMS</title>
<style>
  :root {
    --navy:   #2C3E6A;
    --green:  #1DB96A;
    --red:    #E84040;
    --bg:     #F0EDF8;
    --card:   #FFFFFF;
    --text:   #1B2A4A;
    --muted:  #7A8AAA;
    --border: rgba(27,42,74,0.12);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 2rem;
  }
  header {
    background: var(--navy);
    padding: 1.2rem 1.5rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }
  .header-text h1 { color:#fff; font-size:1.05rem; font-weight:700; }
  .header-text p  { color:rgba(255,255,255,0.5); font-size:0.72rem; margin-top:0.1rem; text-transform:uppercase; letter-spacing:0.08em; }

  .section { margin: 1.2rem 1rem 0; }
  .section-label {
    font-size: 0.7rem; font-weight:700; text-transform:uppercase;
    letter-spacing:0.12em; color:var(--muted); margin-bottom:0.6rem;
  }
  .card {
    background: var(--card); border-radius:16px;
    padding: 1rem 1.1rem;
    box-shadow: 0 2px 12px rgba(27,42,74,0.08);
  }
  .info-row {
    display:flex; justify-content:space-between; align-items:center;
    padding: 0.45rem 0; border-bottom: 1px solid var(--border); font-size:0.9rem;
  }
  .info-row:last-child { border-bottom:none; }
  .info-label { color:var(--muted); font-size:0.78rem; }
  .info-value { font-weight:600; text-align:right; }

  .sms-bubble {
    background: #e5e5ea;
    border-radius: 16px 16px 4px 16px;
    padding: 0.9rem 1rem;
    font-size: 0.93rem;
    line-height: 1.6;
    color: #1c1c1e;
    white-space: pre-wrap;
    word-break: break-word;
    user-select: all;
    -webkit-user-select: all;
  }
  .sms-bubble.confirm { background: #d1f2e0; }
  .sms-bubble.deny    { background: #fde8e8; }

  .sms-btn {
    display: flex; align-items:center; justify-content:center; gap:0.5rem;
    width: 100%; margin-top: 0.65rem;
    padding: 0.85rem; border:none; border-radius:12px;
    font-size: 0.95rem; font-weight:700; cursor:pointer;
    transition: opacity 0.15s, transform 0.1s;
    font-family: inherit; text-decoration:none; color:#fff;
  }
  .sms-btn:active { transform:scale(0.97); opacity:0.85; }
  .sms-btn.confirm { background: var(--green); }
  .sms-btn.deny    { background: var(--red); }

  .copied-toast {
    position:fixed; bottom:1.5rem; left:50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--navy); color:#fff;
    padding: 0.6rem 1.4rem; border-radius:30px;
    font-size:0.85rem; font-weight:600;
    opacity:0; pointer-events:none;
    transition: opacity 0.2s, transform 0.2s;
    z-index:100; white-space:nowrap;
  }
  .copied-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .tip { font-size:0.7rem; color:var(--muted); text-align:center; margin-top:0.4rem; }
  .error { text-align:center; padding:3rem 1rem; color:var(--muted); }
</style>
</head>
<body>

<header>
  <div>
    <div class="header-text">
      <h1>Filemon</h1>
    </div>
  </div>
</header>

<div id="app"></div>
<div class="copied-toast" id="toast">✓ Skopiowano!</div>

<script>
const p = new URLSearchParams(location.search);
const tel  = p.get('tel')  || '';
const imie = p.get('imie') || '';
const data = p.get('data') || '';
const godz = p.get('godz') || '';

const app = document.getElementById('app');

if (!tel || !imie || !data || !godz) {
  app.innerHTML = '<div class="error">Brak danych.</div>';
} else {
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const sep   = isIOS ? '&' : '?';

  const txtConfirm =
`Cześć, ${imie}! \nRezerwacja potwierdzona! \n\n${data} o ${godz}\n\nDo zobaczenia przy kawie i mruczeniu naszych kotów! :)\n\nFilemon Kocia Kawiarnia`;

  const txtDeny =
`Cześć, ${imie}! Dziękujemy za zgłoszenie rezerwacji.\nNiestety w tym terminie (${data} o ${godz}) nie mamy już wolnych stolików.\n\nZadzwoń do nas lub wybierz inny termin.\n\nFilemon Kocia Kawiarnia`;

  const smsConfirm = `sms:${tel}${sep}body=${encodeURIComponent(txtConfirm)}`;
  const smsDeny    = `sms:${tel}${sep}body=${encodeURIComponent(txtDeny)}`;

  app.innerHTML = `
    <div class="section">
      <div class="section-label">Dane rezerwacji</div>
      <div class="card">
        <div class="info-row"><span class="info-label">Gość</span><span class="info-value">${imie}</span></div>
        <div class="info-row"><span class="info-label">Telefon</span><span class="info-value">+${tel}</span></div>
        <div class="info-row"><span class="info-label">Data</span><span class="info-value">${data}</span></div>
        <div class="info-row"><span class="info-label">Godzina</span><span class="info-value">${godz}</span></div>
      </div>
    </div>

    <div class="section">
      <div class="section-label">✅ Potwierdzenie</div>
      <div class="card">
        <div class="sms-bubble confirm">${txtConfirm}</div>
        <a class="sms-btn confirm" href="${smsConfirm}">✅ Otwórz SMS — Potwierdzenie</a>
        </div>
    </div>

    <div class="section">
      <div class="section-label">❌ Brak miejsc</div>
      <div class="card">
        <div class="sms-bubble deny">${txtDeny}</div>
        <a class="sms-btn deny" href="${smsDeny}">❌ Otwórz SMS — Brak miejsc</a>
        </div>
    </div>
  `;
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
</body>
</html>
